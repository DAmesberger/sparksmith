[package]
name = "sparksmith-assist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Fixtures for the tests of the crates above (never in the product).
test-fixtures = []

[dependencies]
sparksmith-core.workspace = true
sparksmith-automation.workspace = true
sparksmith-io.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
schemars.workspace = true
thiserror.workspace = true
sha2.workspace = true
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Degrading openly for models without native PDF: text and rendered pages.
pdf-extract = "0.12"
hayro = "0.9"
# API keys per connection: Keychain, Credential Manager, Secret Service.
# The host name in the online library's sign-in name ("Sparksmith on …").
gethostname = "1.1"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
sparksmith-core = { workspace = true, features = ["test-fixtures"] }
sparksmith-automation = { workspace = true, features = ["test-fixtures"] }
tempfile.workspace = true
sparksmith-solidcraft.workspace = true
