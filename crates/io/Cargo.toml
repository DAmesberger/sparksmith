[package]
name = "sparksmith-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Resolve test resources against the source checkout, including from a shared Cargo target.
test-fixtures = []

[dependencies]
sparksmith-core.workspace = true
# Runs a project's embedded generator modules on load, to check its
# generated parts against them (GP1).
sparksmith-generators.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
pdf-writer.workspace = true
thiserror.workspace = true
tempfile.workspace = true
getrandom.workspace = true
# The content identity of a project file on disk (review finding 9).
sha2.workspace = true
# Race-safe, root-anchored vendor model reads (Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT).
cap-std = "4.0.3"
# The `.sparksmith` ZIP container (D0). MIT; DEFLATE through flate2 and
# zlib-rs (MIT OR Apache-2.0, Zlib). Licences checked by `cargo xtask licences`.
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"

[dev-dependencies]
sparksmith-core = { workspace = true, features = ["test-fixtures"] }
