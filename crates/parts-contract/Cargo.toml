[package]
name = "sparksmith-parts-contract"
description = "The wire contract between Sparksmith and an online parts library: routes, documents, limits, hashes and account sign-in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[lints]
workspace = true

[features]
# JSON schemas of the plain types the core describes to its own clients.
schema = ["dep:schemars"]
# The committed example documents and the conformance test, for the tests of
# a client or a server; never in a shipped build.
test-fixtures = []

[dependencies]
# `float_roundtrip` (the workspace's choice) is part of the contract: a record
# read and written again must give the bytes it was hashed as.
serde.workspace = true
# `raw_value`: the conformance test hashes a record as the server sent it.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
schemars = { workspace = true, optional = true }
