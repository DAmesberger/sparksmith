[package]
name = "sparksmith-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[lints]
workspace = true
[features]
# Test fixtures (`Engine::demo`) for other crates' tests, enabled only by
# their dev-dependencies; the shipped apps never build them.
test-fixtures = []

[dependencies]
sparksmith-units-derive.workspace = true
# The identities, hashes and bounds the online parts library shares.
sparksmith-parts-contract = { workspace = true, features = ["schema"] }
# Generator modules' wire types, codec and runtime interface (no
# interpreter): generated parts' provenance and expansion (GP1).
sparksmith-generator-abi = { workspace = true, features = ["nfc", "complete", "host-schema"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
rhai.workspace = true
sha2.workspace = true
i_overlay.workspace = true
# The readers every export reads its own files back with
# (`fabrication::readback`).
sparksmith-fabcheck.workspace = true
qrcodegen = "1.8"
# Data Matrix (ECC 200) symbols for generated 2D codes; MIT OR Apache-2.0.
datamatrix = { version = "0.3", default-features = false }

[dev-dependencies]
rqrr = { version = "0.10", default-features = false }
